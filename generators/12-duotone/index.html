<!doctype html>
<!--
  Duotone (reproduction)
  Inspired by: https://duotones.co (by Medialoot; clean-room
  reimplementation - grayscale remap to a two-color gradient).
  What it does: maps an image's shadows and highlights to two colors.
  For Claude: self-contained. The duotone() core maps any pixel buffer;
  presets show classic pairings.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duotone (repro)</title>
<style>
  body { margin:0; background:#0e0e10; color:#e8e8ea; font:14px/1.5 ui-monospace,monospace; }
  header { padding:16px 20px; border-bottom:1px solid #26262b; }
  h1 { font-size:15px; margin:0; }
  h1 span { color:#8b8b93; font-weight:400; }
  .bar { display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:12px 20px; background:#17171a; }
  label { color:#8b8b93; display:flex; gap:8px; align-items:center; }
  select,input { accent-color:#f472b6; background:#101013; color:#e8e8ea; border:1px solid #2c2c33; border-radius:6px; padding:4px 8px; }
  input[type=color] { padding:1px 2px; width:42px; height:28px; }
  button { background:#f472b6; color:#000; border:0; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  #drop { margin:20px; padding:40px; border:1px dashed #3a3a42; border-radius:10px; text-align:center; color:#8b8b93; cursor:pointer; }
  canvas { display:block; margin:20px auto; max-width:calc(100% - 40px); }
</style>
</head>
<body>
<header><h1>Duotone <span>- two-color image remap - repro of duotones.co</span></h1></header>
<div class="bar">
  <label>Preset
    <select id="preset">
      <option value="">custom</option>
      <option value="#0b0b3b|#ff6b6b">midnight coral</option>
      <option value="#291a4d|#7ee787">acid purple</option>
      <option value="#12343b|#f7e7ad">deep teal</option>
      <option value="#000000|#ffffff">mono</option>
      <option value="#2b1055|#7597de">ultraviolet</option>
    </select>
  </label>
  <label>Shadows <input type="color" id="dark" value="#0b0b3b"></label>
  <label>Highlights <input type="color" id="light" value="#ff6b6b"></label>
  <label>Contrast <input type="range" id="contrast" min="-50" max="50" value="0"></label>
  <button id="png">Download PNG</button>
</div>
<div id="drop">Drop an image here or click to choose<input type="file" id="file" accept="image/*" hidden></div>
<canvas id="out"></canvas>

<script>
// ---- CONFIG ----------------------------------------------------------
const MAX_WIDTH = 1200;  // working resolution
// ----------------------------------------------------------------------
const out = document.getElementById("out");
const octx = out.getContext("2d");
let img = null;

function hexRgb(hex) {
  return [1,3,5].map(i => parseInt(hex.slice(i, i+2), 16));
}

function duotone(data, dark, light, contrast) {
  const [dr, dg, db] = hexRgb(dark), [lr, lg, lb] = hexRgb(light);
  const f = (259 * (contrast * 2.55 + 255)) / (255 * (259 - contrast * 2.55));
  for (let i = 0; i < data.length; i += 4) {
    let l = (0.2126*data[i] + 0.7152*data[i+1] + 0.0722*data[i+2]) / 255;
    l = Math.max(0, Math.min(1, (f * (l * 255 - 128) + 128) / 255));
    data[i]   = dr + (lr - dr) * l;
    data[i+1] = dg + (lg - dg) * l;
    data[i+2] = db + (lb - db) * l;
  }
}

function render() {
  if (!img) return;
  const w = Math.min(MAX_WIDTH, img.width);
  const h = Math.round(w * img.height / img.width);
  out.width = w; out.height = h;
  octx.drawImage(img, 0, 0, w, h);
  const id = octx.getImageData(0, 0, w, h);
  duotone(id.data,
    document.getElementById("dark").value,
    document.getElementById("light").value,
    +document.getElementById("contrast").value);
  octx.putImageData(id, 0, 0);
}

function loadFile(f) {
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { img = im; URL.revokeObjectURL(url); render(); };
  im.src = url;
}
const drop = document.getElementById("drop"), file = document.getElementById("file");
drop.onclick = () => file.click();
file.onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
drop.ondragover = e => e.preventDefault();
drop.ondrop = e => { e.preventDefault(); e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]); };
document.getElementById("preset").oninput = e => {
  if (!e.target.value) return;
  const [d, l] = e.target.value.split("|");
  document.getElementById("dark").value = d;
  document.getElementById("light").value = l;
  render();
};
for (const id of ["dark","light","contrast"])
  document.getElementById(id).oninput = render;
document.getElementById("png").onclick = () => {
  const a = document.createElement("a");
  a.download = "duotone.png"; a.href = out.toDataURL("image/png"); a.click();
};
</script>
</body>
</html>
