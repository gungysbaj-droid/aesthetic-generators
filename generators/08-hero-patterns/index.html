<!doctype html>
<!--
  Hero Patterns (reproduction)
  Inspired by: https://heropatterns.com (by Steve Schoger, CC BY 4.0 for the
  originals - this repro uses its own simple pattern tiles, not copied paths).
  What it does: repeatable SVG background patterns with color controls,
  emitted as a CSS background declaration.
  For Claude: self-contained. Each entry in PATTERNS is a tile function;
  add your own by drawing inside a w x h tile.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Patterns (repro)</title>
<style>
  body { margin:0; background:#0e0e10; color:#e8e8ea; font:14px/1.5 ui-monospace,monospace; }
  header { padding:16px 20px; border-bottom:1px solid #26262b; }
  h1 { font-size:15px; margin:0; }
  h1 span { color:#8b8b93; font-weight:400; }
  .bar { display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:12px 20px; background:#17171a; }
  label { color:#8b8b93; display:flex; gap:8px; align-items:center; }
  select,input { accent-color:#7ee787; background:#101013; color:#e8e8ea; border:1px solid #2c2c33; border-radius:6px; padding:4px 8px; }
  input[type=color] { padding:1px 2px; width:42px; height:28px; }
  button { background:#7ee787; color:#000; border:0; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  #preview { height:calc(100vh - 130px); }
</style>
</head>
<body>
<header><h1>Hero Patterns <span>- repeatable SVG backgrounds - repro of heropatterns.com</span></h1></header>
<div class="bar">
  <label>Pattern <select id="pattern"></select></label>
  <label>Foreground <input type="color" id="fg" value="#7ee787"></label>
  <label>Background <input type="color" id="bg" value="#0e0e10"></label>
  <label>Opacity <input type="range" id="op" min="5" max="100" value="40"></label>
  <label>Scale <input type="range" id="scale" min="30" max="300" value="100"></label>
  <button id="copy">Copy CSS</button>
</div>
<div id="preview"></div>

<script>
// ---- CONFIG: pattern tiles. Each draws into a w x h SVG tile. --------
const PATTERNS = {
  diagonal: { w: 40, h: 40, draw: f =>
    `<path d="M-10 10 L10 -10 M0 40 L40 0 M30 50 L50 30" stroke="${f}" stroke-width="4"/>` },
  dots: { w: 30, h: 30, draw: f =>
    `<circle cx="15" cy="15" r="3" fill="${f}"/>` },
  grid: { w: 40, h: 40, draw: f =>
    `<path d="M40 0 H0 V40" fill="none" stroke="${f}" stroke-width="2"/>` },
  zigzag: { w: 40, h: 20, draw: f =>
    `<path d="M0 10 L10 0 L20 10 L30 0 L40 10" fill="none" stroke="${f}" stroke-width="3"/>` },
  crosses: { w: 40, h: 40, draw: f =>
    `<path d="M15 5 V25 M5 15 H25" stroke="${f}" stroke-width="4"/>` },
  triangles: { w: 48, h: 48, draw: f =>
    `<path d="M24 8 L40 40 H8 Z" fill="none" stroke="${f}" stroke-width="3"/>` },
  hexagons: { w: 56, h: 100, draw: f =>
    `<path d="M28 66 L0 50 L0 16 L28 0 L56 16 L56 50 Z M28 100 L56 84 M28 100 L0 84" fill="none" stroke="${f}" stroke-width="3"/>` },
  waves: { w: 60, h: 20, draw: f =>
    `<path d="M0 10 Q15 -5 30 10 T60 10" fill="none" stroke="${f}" stroke-width="3"/>` },
  circuit: { w: 60, h: 60, draw: f =>
    `<path d="M10 10 H30 V30 M30 60 V40 H50 M10 30 V50 H20" fill="none" stroke="${f}" stroke-width="2.5"/><circle cx="10" cy="10" r="3" fill="${f}"/><circle cx="50" cy="40" r="3" fill="${f}"/>` },
  weave: { w: 40, h: 40, draw: f =>
    `<rect x="0" y="0" width="18" height="18" fill="${f}"/><rect x="22" y="22" width="18" height="18" fill="${f}"/>` }
};
// ----------------------------------------------------------------------

const sel = document.getElementById("pattern");
for (const name of Object.keys(PATTERNS)) {
  const o = document.createElement("option");
  o.value = o.textContent = name;
  sel.appendChild(o);
}

function render() {
  const name = document.getElementById("pattern").value;
  const fgc = document.getElementById("fg").value;
  const op = +document.getElementById("op").value / 100;
  const r = parseInt(fgc.slice(1,3),16), g = parseInt(fgc.slice(3,5),16), b = parseInt(fgc.slice(5,7),16);
  const p = PATTERNS[name];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${p.w}' height='${p.h}'>${p.draw(`rgba(${r},${g},${b},${op})`)}</svg>`;
  const scale = +document.getElementById("scale").value;
  const size = `${Math.round(p.w*scale/100)}px ${Math.round(p.h*scale/100)}px`;
  const uri = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  const prev = document.getElementById("preview");
  prev.style.backgroundColor = document.getElementById("bg").value;
  prev.style.backgroundImage = uri;
  prev.style.backgroundSize = size;
  prev.dataset.css =
`background-color: ${document.getElementById("bg").value};
background-image: ${uri};
background-size: ${size};`;
}
for (const id of ["pattern","fg","bg","op","scale"])
  document.getElementById(id).oninput = render;
document.getElementById("copy").onclick = async () => {
  await navigator.clipboard.writeText(document.getElementById("preview").dataset.css);
  document.getElementById("copy").textContent = "Copied!";
  setTimeout(() => document.getElementById("copy").textContent = "Copy CSS", 1200);
};
render();
</script>
</body>
</html>
