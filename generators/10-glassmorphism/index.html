<!doctype html>
<!--
  Glassmorphism (reproduction)
  Inspired by: https://glassmorphism.com (clean-room reimplementation of
  the frosted-glass CSS pattern).
  What it does: generates frosted-glass panel CSS over a colorful scene.
  For Claude: self-contained. Output is a small CSS block using
  backdrop-filter; paste onto any overlay element.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glassmorphism (repro)</title>
<style>
  body { margin:0; background:#0e0e10; color:#e8e8ea; font:14px/1.5 ui-monospace,monospace; }
  header { padding:16px 20px; border-bottom:1px solid #26262b; }
  h1 { font-size:15px; margin:0; }
  h1 span { color:#8b8b93; font-weight:400; }
  .bar { display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:12px 20px; background:#17171a; }
  label { color:#8b8b93; display:flex; gap:8px; align-items:center; }
  input { accent-color:#f472b6; background:#101013; color:#e8e8ea; border:1px solid #2c2c33; border-radius:6px; padding:4px 8px; }
  button { background:#f472b6; color:#000; border:0; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  #stage { position:relative; height:calc(100vh - 130px); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .orb { position:absolute; border-radius:50%; filter:blur(2px); }
  #glass { width:min(420px, 80%); padding:32px; }
  #glass h2 { margin:0 0 8px; font-size:18px; }
  #glass p { margin:0; opacity:.8; }
</style>
</head>
<body>
<header><h1>Glassmorphism <span>- frosted glass panels - repro of glassmorphism.com</span></h1></header>
<div class="bar">
  <label>Blur <input type="range" id="blur" min="0" max="40" value="14"></label>
  <label>Opacity <input type="range" id="op" min="5" max="60" value="18"></label>
  <label>Saturation <input type="range" id="sat" min="50" max="250" value="160"></label>
  <label>Border <input type="range" id="border" min="0" max="100" value="40"></label>
  <label>Radius <input type="range" id="radius" min="0" max="40" value="18"></label>
  <button id="copy">Copy CSS</button>
</div>
<div id="stage">
  <div class="orb" style="width:340px;height:340px;background:#7c3aed;top:12%;left:14%"></div>
  <div class="orb" style="width:280px;height:280px;background:#ec4899;bottom:10%;right:16%"></div>
  <div class="orb" style="width:180px;height:180px;background:#22d3ee;top:55%;left:38%"></div>
  <div id="glass">
    <h2>Frosted glass</h2>
    <p>This panel uses backdrop-filter. Adjust the sliders and copy the CSS.</p>
  </div>
</div>

<script>
function render() {
  const blur = +document.getElementById("blur").value;
  const op = +document.getElementById("op").value / 100;
  const sat = +document.getElementById("sat").value;
  const border = +document.getElementById("border").value / 100;
  const radius = +document.getElementById("radius").value;
  const css =
`background: rgba(255, 255, 255, ${op});
backdrop-filter: blur(${blur}px) saturate(${sat}%);
-webkit-backdrop-filter: blur(${blur}px) saturate(${sat}%);
border-radius: ${radius}px;
border: 1px solid rgba(255, 255, 255, ${border});
box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);`;
  document.getElementById("glass").style.cssText = css;
  document.getElementById("glass").dataset.css = css;
}
for (const id of ["blur","op","sat","border","radius"])
  document.getElementById(id).oninput = render;
document.getElementById("copy").onclick = async () => {
  await navigator.clipboard.writeText(document.getElementById("glass").dataset.css);
  document.getElementById("copy").textContent = "Copied!";
  setTimeout(() => document.getElementById("copy").textContent = "Copy CSS", 1200);
};
render();
</script>
</body>
</html>
